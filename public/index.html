<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网文件传输</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📡 局域网文件传输</h1>
            <div class="device-info">
                <span id="device-name">未命名设备</span>
                <span id="connection-status" class="status-disconnected">未连接</span>
            </div>
        </header>

        <main>
            <!-- 设备选择部分 -->
            <section class="devices-section">
                <h2>📱 在线设备</h2>
                <div id="devices-list" class="devices-list">
                    <div class="empty-state">
                        <p>正在搜索设备...</p>
                    </div>
                </div>
            </section>

            <!-- 文件选择部分 -->
            <section class="file-section">
                <h2>📁 选择文件</h2>
                <div class="file-upload-area" id="drop-zone">
                    <input type="file" id="file-input" multiple>
                    <div class="upload-icon">📤</div>
                    <p>点击选择文件或拖拽文件到此处</p>
                    <p class="hint">支持多文件传输</p>
                </div>
                <div id="selected-files" class="selected-files"></div>
            </section>

            <!-- 传输控制部分 -->
            <section class="transfer-section">
                <h2>🚀 开始传输</h2>
                <div class="transfer-controls">
                    <select id="target-device" class="device-select" disabled>
                        <option value="">选择接收设备</option>
                    </select>
                    <button id="send-btn" class="btn btn-primary" disabled>发送文件</button>
                </div>
            </section>

            <!-- 传输进度部分 -->
            <section class="progress-section">
                <h2>📊 传输进度</h2>
                <div id="transfer-list" class="transfer-list">
                    <div class="empty-state">
                        <p>暂无传输任务</p>
                    </div>
                </div>
            </section>

            <!-- 接收的文件部分 -->
            <section class="received-section">
                <h2>📥 接收的文件</h2>
                <div id="received-files" class="received-files">
                    <div class="empty-state">
                        <p>暂无接收文件</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 模态框：接收文件确认 -->
        <div id="receive-modal" class="modal">
            <div class="modal-content">
                <h3>📨 接收文件</h3>
                <p id="receive-message"></p>
                <div class="modal-actions">
                    <button id="accept-btn" class="btn btn-success">接受</button>
                    <button id="reject-btn" class="btn btn-danger">拒绝</button>
                </div>
            </div>
        </div>

        <!-- 模态框：设置设备名称 -->
        <div id="name-modal" class="modal">
            <div class="modal-content">
                <h3>🏷️ 设置设备名称</h3>
                <input type="text" id="device-name-input" placeholder="输入设备名称" maxlength="20">
                <div class="modal-actions">
                    <button id="confirm-name-btn" class="btn btn-primary">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
