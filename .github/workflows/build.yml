name: Build Desktop and Mobile Apps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:
  build-windows:
    name: 🖥️ Build Windows EXE
    runs-on: windows-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: desktop/package-lock.json
      
    - name: 📦 Install desktop dependencies
      working-directory: ./desktop
      run: npm ci
      
    - name: 🏗️ Build Windows EXE
      working-directory: ./desktop
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    - name: 📤 Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: lan-file-transfer-windows
        path: desktop/dist/*.exe
        retention-days: 30
        if-no-files-found: error

  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: mobile/package-lock.json
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'
      
    - name: 📦 Install mobile dependencies
      working-directory: ./mobile
      run: npm ci
      
    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: 🔐 Grant execute permission for gradlew
      working-directory: ./mobile/android
      run: chmod +x gradlew
      
    - name: 🏗️ Build Android APK
      working-directory: ./mobile/android
      run: ./gradlew assembleRelease --stacktrace
      
    - name: 📤 Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: lan-file-transfer-android
        path: mobile/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error

  create-release:
    name: 🚀 Create Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📥 Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: lan-file-transfer-windows
        path: ./artifacts/windows
      
    - name: 📥 Download Android artifact
      uses: actions/download-artifact@v4
      with:
        name: lan-file-transfer-android
        path: ./artifacts/android
      
    - name: 📝 Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="v$(date +%Y%m%d-%H%M%S)"
        else
          VERSION="v${{ github.run_number }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
      
    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: 局域网文件传输 ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifacts/windows/*.exe
          ./artifacts/android/*.apk
        body: |
          ## 📦 局域网文件传输工具 ${{ steps.version.outputs.version }}
          
          ### ✨ 新功能
          - 虚拟Wifi热点连接（无需外部网络）
          - 二维码扫描连接
          - 4位数字码连接
          - 快速文件传输
          - 实时传输进度显示
          - 灵活的热点创建设置
          
          ### 📥 下载说明
          
          #### Windows 用户
          下载 `lan-file-transfer-windows` 中的 `.exe` 文件，直接运行即可。
          
          #### Android 用户
          下载 `lan-file-transfer-android` 中的 `.apk` 文件，安装到手机。
          
          ### 🚀 使用方法
          1. 两台设备安装对应应用
          2. 一台设备创建 Wifi 热点（或使用现有热点）
          3. 另一台设备连接到同一热点
          4. 使用二维码或数字码进行设备配对
          5. 选择文件并开始传输
          
          ### ⚙️ 技术栈
          - 桌面端: Electron + Node.js
          - 移动端: React Native
          - 通信: WebSocket + HTTP
          
          ### 📝 系统要求
          - Windows: Windows 10 或更高版本
          - Android: Android 5.0 (API 21) 或更高版本
          
          ### 🔐 权限说明
          - Windows: 需要管理员权限创建热点
          - Android: 需要位置、存储、相机权限
          
          ---
          
          🤝 如有问题，请在 GitHub Issues 中反馈。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}