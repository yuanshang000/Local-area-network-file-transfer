name: Build Windows EXE

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '18'

jobs:
  build-windows:
    name: 🖥️ Build Windows EXE
    runs-on: windows-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: desktop/package-lock.json
      
    - name: 📦 Install desktop dependencies
      working-directory: ./desktop
      run: npm install
      
    - name: 🏗️ Build Windows EXE
      working-directory: ./desktop
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_ENV: production
      
    - name: 📋 List built files
      working-directory: ./desktop
      run: |
        echo "Built files:"
        dir dist
      
    - name: 📤 Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: lan-file-transfer-windows
        path: |
          desktop/dist/*.exe
          desktop/dist/*.msi
        retention-days: 30
        if-no-files-found: warn

  create-release:
    name: 🚀 Create Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📥 Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: lan-file-transfer-windows
        path: ./artifacts/windows
      
    - name: 📝 Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="v$(date +%Y%m%d-%H%M%S)"
        else
          VERSION="v${{ github.run_number }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
      
    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: windows-${{ steps.version.outputs.version }}
        name: 局域网文件传输 ${{ steps.version.outputs.version }} (Windows)
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifacts/windows/*.exe
          ./artifacts/windows/*.msi
        body: |
          ## 📦 局域网文件传输工具 ${{ steps.version.outputs.version }} - Windows 版本
          
          ### ✨ 功能特性
          - **虚拟WiFi热点** - 创建热点供手机连接
          - **二维码连接** - 扫码即可配对
          - **4位数字码** - 简单输入快速连接
          - **高速传输** - 通过WiFi传输文件
          - **实时进度** - 显示传输进度
          - **系统托盘** - 最小化到托盘运行
          
          ### 📥 安装说明
          1. 下载 `.exe` 安装程序或便携版
          2. 运行安装程序（需要管理员权限创建热点）
          
          ### 🚀 使用方法
          
          **接收方（创建热点）：**
          1. 打开应用
          2. 点击"创建虚拟热点"
          3. 显示二维码和匹配码供发送方连接
          
          **发送方：**
          1. 打开应用
          2. 连接到接收方的WiFi热点
          3. 输入匹配码或扫描二维码
          4. 选择文件并开始传输
          
          ### ⚙️ 技术栈
          - 平台: Electron + Node.js
          - 通信: Socket.IO
          - 系统: Windows 10 或更高版本
          
          ---
          
          🤝 如有问题，请在 [GitHub Issues](../../issues) 中反馈。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
