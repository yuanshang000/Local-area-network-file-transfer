name: Build Android APK

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
      
    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: 🔐 Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'
      
    - name: 🏗️ Build Android APK
      working-directory: ./mobile/android
      run: |
        chmod +x gradlew
        gradle wrapper --gradle-version 8.0
        ./gradlew assembleRelease --stacktrace --no-daemon
      
    - name: 📋 List APK files
      working-directory: ./mobile/android
      run: |
        echo "APK files:"
        find . -name "*.apk" -type f
      
    - name: 📤 Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: lan-file-transfer-android
        path: mobile/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn

  create-release:
    name: 🚀 Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📥 Download Android artifact
      uses: actions/download-artifact@v4
      with:
        name: lan-file-transfer-android
        path: ./artifacts/android
      
    - name: 📝 Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="v$(date +%Y%m%d-%H%M%S)"
        else
          VERSION="v${{ github.run_number }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
      
    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: android-${{ steps.version.outputs.version }}
        name: 局域网文件传输 ${{ steps.version.outputs.version }} (Android)
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifacts/android/*.apk
        body: |
          ## 📦 局域网文件传输工具 ${{ steps.version.outputs.version }} - Android 版本
          
          ### ✨ 功能特性
          - **虚拟WiFi热点** - 无需外部网络即可传输
          - **二维码连接** - 扫码即可配对
          - **4位数字码** - 简单输入快速连接
          - **蓝牙发现** - 自动发现附近设备
          - **高速传输** - 通过WiFi传输文件
          - **实时进度** - 显示传输进度
          
          ### 📥 安装说明
          1. 下载 APK 文件
          2. 安装到 Android 手机（需要允许未知来源）
          3. 授予必要权限（位置、存储、相机、蓝牙）
          
          ### 🚀 使用方法
          
          **接收方：**
          1. 打开应用，选择"接收文件"
          2. 等待热点创建完成
          3. 显示二维码和匹配码供发送方连接
          
          **发送方：**
          1. 打开应用，选择"发送文件"
          2. 选择要发送的文件
          3. 扫描二维码 / 输入匹配码 / 蓝牙发现设备
          4. 开始传输
          
          ### ⚙️ 技术栈
          - 平台: Android Native (Java)
          - 通信: Socket.IO
          - 最低版本: Android 5.0 (API 21)
          
          ---
          
          🤝 如有问题，请在 [GitHub Issues](../../issues) 中反馈。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}