name: Build Android APK

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'
      
    - name: 📦 Install mobile dependencies
      working-directory: ./mobile
      run: npm install --legacy-peer-deps
      
    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: 🔐 Initialize Gradle Wrapper
      working-directory: ./mobile/android
      run: |
        # Remove existing gradle-wrapper.jar if it exists
        rm -f gradle/wrapper/gradle-wrapper.jar
        
        # Download the correct gradle-wrapper.jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
        
        # Make gradlew executable
        chmod +x gradlew
      
    - name: 🏗️ Build Android APK
      working-directory: ./mobile/android
      run: ./gradlew assembleRelease --stacktrace
      
    - name: 📤 Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: lan-file-transfer-android
        path: mobile/android/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: error

  create-release:
    name: 🚀 Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📥 Download Android artifact
      uses: actions/download-artifact@v4
      with:
        name: lan-file-transfer-android
        path: ./artifacts/android
      
    - name: 📝 Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="v$(date +%Y%m%d-%H%M%S)"
        else
          VERSION="v${{ github.run_number }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"
      
    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: 局域网文件传输 ${{ steps.version.outputs.version }} (Android)
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifacts/android/*.apk
        body: |
          ## 📦 局域网文件传输工具 ${{ steps.version.outputs.version }} - Android 版本
          
          ### ✨ 新功能
          - 虚拟Wifi热点连接（无需外部网络）
          - 二维码扫描连接
          - 4位数字码连接
          - 快速文件传输
          - 实时传输进度显示
          - 灵活的热点创建设置
          
          ### 📥 下载说明
          
          #### Android 用户
          下载 `lan-file-transfer-android` 中的 `.apk` 文件，安装到手机。
          
          ### 🚀 使用方法
          1. 安装 APK 到手机
          2. 授予必要权限（位置、存储、相机）
          3. 连接到 Wifi 热点（或创建热点）
          4. 使用二维码或数字码与电脑配对
          5. 选择文件并开始传输
          
          ### ⚙️ 技术栈
          - 移动端: React Native
          - 通信: WebSocket + HTTP
          
          ### 📝 系统要求
          - Android: Android 5.0 (API 21) 或更高版本
          - 需要位置、存储、相机权限
          
          ---
          
          🤝 如有问题，请在 GitHub Issues 中反馈。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}